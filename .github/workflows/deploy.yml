name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test


      - name: Transfer JAR over SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          port: 22
          source: "build/libs/*.jar"
          target: "/home/ubuntu/kidscafe-backend"
          strip_components: 2


      - name: Deploy and Restart via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/kidscafe-backend
            
        
            CURRENT_PID=$(lsof -t -i:8080)
            
            if [ -z "$CURRENT_PID" ]; then
              echo "> 현재 8080 포트에서 구동 중인 백엔드 애플리케이션이 없으므로 종료하지 않습니다."
            else
              echo "> 8080 포트 점유 프로세스 발견! 안전 종료 시도 (PID: $CURRENT_PID)"
              kill -15 $CURRENT_PID
              sleep 5
            
              
              RECHECK_PID=$(lsof -t -i:8080)
              if [ ! -z "$RECHECK_PID" ]; then
                echo "> 프로세스가 완전히 종료되지 않아 강제 종료(kill -9)를 수행합니다."
                kill -9 $RECHECK_PID
                sleep 2
              fi
            fi
            

            JAR_NAME=$(ls -tr *.jar | grep -v "plain" | tail -n 1)
            echo "> 새 애플리케이션 배포 파일명: $JAR_NAME"
            
  
            chmod +x $JAR_NAME
            nohup java -jar \
              -DDB_URL='${{ secrets.PROD_DB_URL }}' \
              -DDB_USERNAME='${{ secrets.PROD_DB_USERNAME }}' \
              -DDB_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}' \
              $JAR_NAME > spring_app.log 2>&1 &
            
            echo "> 백엔드 자동 배포 프로세스가 정상 완료되었습니다."
            
            
